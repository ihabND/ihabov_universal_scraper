name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      # The tests run offline: no real sites, no Redis server and no browser download needed.
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
