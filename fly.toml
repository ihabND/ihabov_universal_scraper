# fly.toml app configuration file generated for ihabov-universal-scraper on 2026-09-23T19:43:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ihabov-universal-scraper'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# Accounts and API keys live in SQLite on this volume. Create it once with
# `fly volumes create scraper_data -r ams -s 1`. A volume belongs to one machine.
[mounts]
  source = 'scraper_data'
  destination = '/data'

[env]
  DATABASE_PATH = '/data/scraper.db'
