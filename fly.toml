# fly.toml app configuration file generated for ihabov-universal-scraper on 2026-09-23T19:43:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ihabov-universal-scraper'
primary_region = 'ams'

[build]

[env]
  STRATEGY_DB = '/data/strategies.db'

# Site strategies; created once with `fly volumes create scraper_data --size 1 --region ams`.
[mounts]
  source = 'scraper_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
