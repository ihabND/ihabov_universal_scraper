<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ihabov Scraper{% endblock %}</title>
  <meta name="description" content="Scrape any public web page as clean HTML, or as structured JSON on supported sites.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ asset_url('app.css') }}">
  {% if user %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar{% if user %} signed-in{% endif %}">
    <a class="mark" href="{{ '/app' if user else '/' }}"><i aria-hidden="true">~</i><span class="name">Ihabov Scraper</span><small>v1</small></a>
    <nav>
      {% if page == "landing" %}<a class="hide-sm" href="#sites">Supported sites</a>{% endif %}
      <a href="/docs" {% if page == "docs" %}aria-current="page"{% endif %}>API docs</a>
      {% if user %}
      <a href="/app" {% if page == "app" %}aria-current="page"{% endif %}>App</a>
      <a href="/dashboard" {% if page == "dashboard" %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="/account" {% if page == "account" %}aria-current="page"{% endif %}>Account</a>
      <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit">Log out</button></form>
      {% else %}
      <a href="/login" {% if page == "login" %}aria-current="page"{% endif %}>Log in</a>
      <a class="cta" href="/signup">Sign up</a>
      {% endif %}
    </nav>
  </header>
  {% block content %}{% endblock %}
  <script src="{{ asset_url('app.js') }}" defer></script>
</body>
</html>
