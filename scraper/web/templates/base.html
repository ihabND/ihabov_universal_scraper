<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ihabov Scraper{% endblock %}</title>
  <meta name="description" content="Scrape any public web page as clean HTML, or as structured JSON on supported sites.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ asset_url('app.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="mark" href="/"><i aria-hidden="true">~</i>Ihabov Scraper<small>v1</small></a>
    <nav>
      <a class="hide-sm" href="/docs#json">Supported sites</a>
      <a href="/sites" {% if page == "sites" %}aria-current="page"{% endif %}>Sites</a>
      <a href="/docs" {% if page == "docs" %}aria-current="page"{% endif %}>API docs</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
  <script src="{{ asset_url('app.js') }}" defer></script>
</body>
</html>
