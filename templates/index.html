<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ihabov Universal Scraper</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    form { display: grid; gap: .75rem; }
    label { display: grid; gap: .25rem; font-weight: 600; }
    input, select, button { font: inherit; padding: .5rem; }
    button { cursor: pointer; }
    .error { background: #fde8e8; color: #9b1c1c; padding: .75rem; border-radius: 4px; }
    .meta { color: #555; }
    pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>Ihabov Universal Scraper</h1>

  <form method="post" action="/">
    <label>URL
      <input type="text" name="url" value="{{ url or '' }}" placeholder="https://example.com" required>
    </label>
    <label>Mode
      <select name="mode">
        <option value="text" {% if mode == "text" %}selected{% endif %}>Text</option>
        <option value="html" {% if mode == "html" %}selected{% endif %}>HTML</option>
      </select>
    </label>
    <label>API key
      <input type="password" name="api_key" value="{{ api_key or '' }}" autocomplete="off" required>
    </label>
    <button type="submit">Scrape</button>
  </form>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  {% if result %}
    <h2>Result</h2>
    <p class="meta">{{ result.url }} &middot; status {{ result.status_code }}</p>
    {% if result.content is string %}
      <pre>{{ result.content }}</pre>
    {% else %}
      <pre>{{ result.content | join("\n") }}</pre>
    {% endif %}
  {% endif %}
</body>
</html>
