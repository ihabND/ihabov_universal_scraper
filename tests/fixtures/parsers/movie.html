<html><head><script type="application/ld+json">{"@context":"https://schema.org","@type":"Movie","url":"https://www.imdb.com/title/tt0111161/","name":"The Shawshank Redemption","image":"https://m.media-amazon.com/images/M/MV5BMDAyY2FhYjctNDc5OS00MDNlLThiMGUtY2UxYWVkNGY2ZjljXkEyXkFqcGc@._V1_.jpg","description":"After a banker is sentenced to life in Shawshank Prison, he forms an unlikely friendship with a seasoned inmate and clings to hope amid cruelty and corruption.","review":{"@type":"Review","itemReviewed":{"@type":"Movie","url":"https://www.imdb.com/title/tt0111161/"},"author":{"@type":"Person","name":"EyeDunno"},"dateCreated":"2005-11-21","inLanguage":"English","name":"Don&apos;t Rent Shawshank.","reviewBody":"I&apos;m trying to save you money; this is the last film title that you should consider borrowing. Renting Shawshank will cost you five bucks... just plunk down the $25 and own the title. You&apos;ll wind up going back to this gem time and time again. This is one of few movies that are truly timeless. And it&apos;s entertaining and moving, no matter how many times you view it.\n\nForget about what others (including myself) might suggest you&apos;ll discover in &quot;The Shawshank Redemption;&quot; when you watch it, you&apos;ll identify something very personal in your own life with a scene, a character, or a moment in this uncomplicated movie. When you need hope, you&apos;ll look for Shawshank. When you want to believe in the will of overcoming even the greatest obstacles, Shawshank will uplift you in ways that you can&apos;t find in movies today. \n\nSome liken the film to some kind of spiritual awakening. Of course, some can go to a church or mosque to find enlightenment and Faith in humanity, but most places of worship are open only certain days or times. But when you need affirmation of the lasting bond of friendships that prevail over the most dire circumstances, Shawshank will give it to you. It makes grown men (like me) cry, still. I wonder whether Shawshank was truly meant for viewing in the privacy of the home, because it is a personal experience that really makes you look inward. Nominated for seven, this is the best film that never one a single Oscar. \n\nHow ironic that an innocent man winds up being surrounded by the corruption of the legal system. Shawshank itself is similar to the character of Andy Dufresne. Prejudging this classic film, critics couldn&apos;t get past the title. The public followed suit, initially dismissing Shawshank, which failed in the box office just like &quot;It&apos;s a Wonderful Life&quot; and &quot;Citizen Kane.&quot; It could have just whithered away on the store shelves, like Andy Dufresne could have in his own cell. But the characters prevailed, because Andy -- And Shawshank -- stayed true. Now, these movies are right up there as the most popular films of all time. \n\nAnyone who has yet to watch Shawshank may be so jaded of movies, or the film&apos;s title, or how a 2-1/2- hour movie set inside the walls of a prison can manage to tap the soul of such a wide range of people. Shawshank has not one explosion. I wonder if it even has a single special effect or digitally- enhanced frame. \n\nBut every aspect of Shawshank fit together. The acting from the top to the bit part. The musical score. The editing. The photography. The story, from opening credits to final scene. All involved, including the town of Mansfield, Ohio (where Shawshank was actually filmed) played their roles perfectly. Shawshank is a must- see, must- own title.","reviewRating":{"@type":"Rating","worstRating":1,"bestRating":10,"ratingValue":10}},"aggregateRating":{"@type":"AggregateRating","ratingCount":3266169,"bestRating":10,"worstRating":1,"ratingValue":9.3},"contentRating":"R","genre":["Drama"],"datePublished":"1994-10-14","keywords":"prison,based on the works of stephen king,escape from prison,friendship between men,wrongful conviction","trailer":{"@type":"VideoObject","name":"Official Trailer","embedUrl":"https://www.imdb.com/video/vi3877612057/","thumbnail":{"@type":"ImageObject","contentUrl":"https://m.media-amazon.com/images/M/MV5BNjQ2NDA3MDcxMF5BMl5BanBnXkFtZTgwMjE5NTU0NzE@._V1_.jpg"},"thumbnailUrl":"https://m.media-amazon.com/images/M/MV5BNjQ2NDA3MDcxMF5BMl5BanBnXkFtZTgwMjE5NTU0NzE@._V1_.jpg","url":"https://www.imdb.com/video/vi3877612057/","description":"Two imprisoned men bond over a number of years, finding solace and eventual redemption through acts of common decency.\r\n","duration":"PT2M11S","uploadDate":"2014-03-05T14:13:19Z"},"actor":[{"@type":"Person","url":"https://www.imdb.com/name/nm0000209/","name":"Tim Robbins"},{"@type":"Person","url":"https://www.imdb.com/name/nm0000151/","name":"Morgan Freeman"},{"@type":"Person","url":"https://www.imdb.com/name/nm0348409/","name":"Bob Gunton"}],"director":[{"@type":"Person","url":"https://www.imdb.com/name/nm0001104/","name":"Frank Darabont"}],"creator":[{"@type":"Organization","url":"https://www.imdb.com/company/co0040620/"},{"@type":"Person","url":"https://www.imdb.com/name/nm0000175/","name":"Stephen King"},{"@type":"Person","url":"https://www.imdb.com/name/nm0001104/","name":"Frank Darabont"}],"duration":"PT2H22M"}</script></head><body></body></html>
